
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFSS AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f6ff;font-family:Arial,sans-serif}
main{max-width:900px;margin:35px auto;padding:20px}
.card{background:#141c31;border:1px solid #303b5c;border-radius:18px;padding:24px}
h1{margin-top:0;color:#a9b5ff}
p{color:#b9c5df;line-height:1.6}
label{display:block;margin:18px 0 8px;font-weight:bold}
textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #465271;background:#0b1225;color:white;font-size:16px}
textarea{min-height:220px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
button{margin-top:20px;background:#7c8cff;color:#08102c;border:0;padding:14px 20px;border-radius:9px;font-size:16px;font-weight:bold;cursor:pointer}
.note{font-size:13px;color:#9eacce}
</style>
</head>
<body>
<main>
<section class="card">
<h1>🎬 OFSS AI Video Studio</h1>
<p>अपनी स्क्रिप्ट से YouTube वीडियो बनाने की शुरुआत करें।</p>

<label for="script">अपनी वीडियो स्क्रिप्ट लिखें या पेस्ट करें</label>
<textarea id="script" placeholder="यहाँ अपनी स्क्रिप्ट पेस्ट करें..."></textarea>
<p class="note"><span id="count">0</span> अक्षर</p>

<label for="duration">वीडियो का प्रकार चुनें</label>
<div class="grid">
<select id="duration">
<option value="shorts">YouTube Shorts — 30–60 सेकंड</option>
<option value="short">छोटा वीडियो — 1–3 मिनट</option>
<option value="normal" selected>सामान्य YouTube वीडियो — 5–10 मिनट</option>
<option value="documentary">लंबा डॉक्यूमेंट्री वीडियो — 10–20 मिनट</option>
</select>
</div>

<label for="format">वीडियो फ़ॉर्मेट</label>
<select id="format">
<option value="landscape">YouTube Landscape — 16:9</option>
<option value="portrait">YouTube Shorts Portrait — 9:16</option>
</select>

<button id="start">वीडियो बनाने की तैयारी करें</button>
<p id="status" role="status"></p>
<p class="note">यह शुरुआती इंटरफ़ेस है। वास्तविक AI वीडियो जनरेशन और MP4 डाउनलोड की सुविधा अगले चरणों में जोड़ी जाएगी।</p>
</section>
</main>
<script>
const scriptBox=document.getElementById('script');
scriptBox.addEventListener('input',()=>{
 document.getElementById('count').textContent=scriptBox.value.length;
});
document.getElementById('start').addEventListener('click',()=>{
 const text=scriptBox.value.trim();
 const status=document.getElementById('status');
 if(!text){
  status.textContent='कृपया पहले अपनी स्क्रिप्ट लिखें या पेस्ट करें।';
  return;
 }
 status.textContent='आपकी स्क्रिप्ट तैयार है। वास्तविक AI वीडियो जनरेशन जोड़ने का काम अगले चरण में होगा।';
});
</script>
</body>
</html>
