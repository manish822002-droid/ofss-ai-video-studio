
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OFSS AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#f1f5f9;font-family:Arial,sans-serif}
main{max-width:850px;margin:35px auto;padding:20px}
.panel{background:#151f32;border:1px solid #2d3b52;border-radius:16px;padding:24px}
h1{margin-top:0;color:#60d5ff}
p{line-height:1.6;color:#cbd5e1}
label{display:block;font-weight:bold;margin:18px 0 8px}
textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #475569;background:#0b1120;color:white;font-size:16px}
textarea{min-height:220px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
button{margin-top:20px;padding:14px 18px;width:100%;border:0;border-radius:9px;background:#06b6d4;color:#06121c;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#status{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:#94a3b8}
@media(max-width:600px){.row{grid-template-columns:1fr}main{padding:12px}.panel{padding:17px}}
</style>
</head>
<body>
<main>
<div class="panel">
<h1>🎬 OFSS AI Video Studio</h1>
<p>अपनी स्क्रिप्ट से आवाज़ और टेक्स्ट दृश्यों वाला MP4 वीडियो बनाएँ।</p>

<label for="script">अपनी वीडियो स्क्रिप्ट लिखें या पेस्ट करें</label>
<textarea id="script" maxlength="12000" placeholder="यहाँ अपनी स्क्रिप्ट लिखें या पेस्ट करें..."></textarea>
<p id="count" class="note">0 / 12000 अक्षर</p>

<div class="row">
<div>
<label for="duration">वीडियो का प्रकार</label>
<select id="duration">
<option value="shorts">YouTube Shorts — 30–60 सेकंड</option>
<option value="short">छोटा वीडियो — 1–3 मिनट</option>
<option value="normal" selected>सामान्य वीडियो — 5–10 मिनट</option>
<option value="long">लंबी डॉक्यूमेंट्री — 10–20 मिनट</option>
</select>
</div>
<div>
<label for="format">वीडियो फ़ॉर्मेट</label>
<select id="format">
<option value="landscape">YouTube Landscape — 16:9</option>
<option value="portrait">YouTube Shorts Portrait — 9:16</option>
</select>
</div>
</div>

<label for="voice">आवाज़ चुनें</label>
<select id="voice">
<option value="hi-IN-SwaraNeural">हिंदी — महिला आवाज़</option>
<option value="hi-IN-MadhurNeural">हिंदी — पुरुष आवाज़</option>
<option value="en-US-AriaNeural">English — Female voice</option>
</select>

<button id="make">🎬 वीडियो बनाएँ और MP4 डाउनलोड करें</button>
<div id="status" role="status" aria-live="polite"></div>
<p class="note">वीडियो बनाने में समय लग सकता है। मुफ़्त सर्वर पर लंबे टेक्स्ट के लिए समय या मेमोरी की सीमा आ सकती है।</p>
</div>
</main>

<script>
const API_URL = "https://ofss-ai-video-api.onrender.com/api/video";
const scriptBox = document.getElementById("script");
const count = document.getElementById("count");
const button = document.getElementById("make");
const statusBox = document.getElementById("status");

scriptBox.addEventListener("input", () => {
  count.textContent = scriptBox.value.length + " / 12000 अक्षर";
});

button.addEventListener("click", async () => {
  const script = scriptBox.value.trim();

  if (script.length < 10) {
    statusBox.textContent = "कृपया कम-से-कम 10 अक्षरों की स्क्रिप्ट लिखें।";
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ वीडियो बनाया जा रहा है...";
  statusBox.textContent = "सर्वर से संपर्क हो रहा है। कृपया पेज खुला रखें।";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        script: script,
        voice: document.getElementById("voice").value,
        format: document.getElementById("format").value
      })
    });

    if (!response.ok) {
      let message = "वीडियो नहीं बन पाया।";
      try {
        const error = await response.json();
        message = error.detail || message;
      } catch (_) {}
      throw new Error(message);
    }

    const blob = await response.blob();

    if (!blob.size) {
      throw new Error("सर्वर से खाली वीडियो फ़ाइल मिली।");
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "ofss-ai-video.mp4";
    document.body.appendChild(link);
    link.click();
    link.remove();

    statusBox.textContent = "वीडियो तैयार है! MP4 डाउनलोड शुरू हो गया है।";
    setTimeout(() => URL.revokeObjectURL(url), 60000);

  } catch (error) {
    statusBox.textContent = "समस्या: " + error.message +
      "\n\nअगर सर्वर पहली बार चालू हो रहा है, तो कुछ देर बाद दोबारा कोशिश करें।";
  } finally {
    button.disabled = false;
    button.textContent = "🎬 वीडियो बनाएँ और MP4 डाउनलोड करें";
  }
});
</script>
</body>
</html>
